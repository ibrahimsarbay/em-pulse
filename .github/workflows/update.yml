name: EM Pulse — Güncelle & Deploy

on:
  schedule:
    - cron: '0 4 * * *'   # Her gün 04:00 UTC (sabah 07:00 TR)
  workflow_dispatch:        # Elle tetikleme (Actions → Run workflow)

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: History cache'i yükle
        uses: actions/cache/restore@v4
        with:
          path: public/data/history.json
          key: pulse-history-${{ github.run_id }}
          restore-keys: |
            pulse-history-

      - name: History dosyasını kontrol et
        run: |
          mkdir -p public/data
          if [ -f public/data/history.json ]; then
            echo "✅ Cache'den yüklendi:"
            python3 -c "
          import json
          d=json.load(open('public/data/history.json'))
          raw=d.get('raw',d) if isinstance(d,dict) else d
          print(f'  {len(raw)} gün kaydı mevcut')
          for r in raw[-3:]:
              print(f'  {r[\"date\"]} — {r[\"title\"][:60]}')
          " 2>/dev/null || echo "  (parse edilemedi)"
          else
            echo "⚠️ Cache boş, ilk çalışma"
            echo '[]' > public/data/history.json
          fi

      - name: PubMed verisi çek
        run: node scripts/fetch.js --force

      - name: History cache'i kaydet
        uses: actions/cache/save@v4
        with:
          path: public/data/history.json
          key: pulse-history-${{ github.run_id }}

      - name: Hosting'e FTP ile deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_SERVER }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          server-dir:  ${{ secrets.FTP_REMOTE_DIR }}
          local-dir:   ./public/
          protocol:    ftps
          port:        21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

name: EM Pulse — Güncelle & Deploy

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: History kontrolü
        run: |
          if [ -f public/data/history.json ]; then
            echo "✅ Repo'da history.json mevcut:"
            python3 -c "
          import json
          d=json.load(open('public/data/history.json'))
          raw=d.get('raw',d) if isinstance(d,dict) else d
          print(f'  {len(raw)} gün kaydı')
          " 2>/dev/null || echo "  (okunamadı)"
          else
            echo "⚠️ history.json yok, oluşturuluyor"
            mkdir -p public/data
            echo '[]' > public/data/history.json
          fi

      - name: PubMed verisi çek
        run: node scripts/fetch.js --force

      - name: History'yi repo'ya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/history.json
          git diff --cached --quiet || git commit -m "chore: history güncellendi ($(date +%Y-%m-%d))"
          git push

      - name: Hosting'e FTP ile deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_SERVER }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          server-dir:  ${{ secrets.FTP_REMOTE_DIR }}
          local-dir:   ./public/
          protocol:    ftps
          port:        21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
